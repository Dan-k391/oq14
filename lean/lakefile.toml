name = "oq14"
version = "0.1.0"
defaultTargets = ["OQ14", "Maxwell", "HCurl", "HCurlDomain", "HCurlCutoff", "WeakPoynting", "ModalAlgebra", "RadialGreen", "StaticVolume", "LongitudinalProjection", "ModalWronskian"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.19.0"

[[lean_lib]]
name = "OQ14"

[[lean_lib]]
name = "Maxwell"

[[lean_lib]]
name = "HCurl"

[[lean_lib]]
name = "HCurlDomain"

[[lean_lib]]
name = "HCurlCutoff"

[[lean_lib]]
name = "WeakPoynting"
roots = ["WeakPoynting", "WeakPoynting.Green", "WeakPoynting.Poynting", "WeakPoynting.Local", "WeakPoynting.Conservation", "WeakPoynting.Slices", "WeakPoynting.Representative", "WeakPoynting.Weighted"]

[[lean_lib]]
name = "ModalAlgebra"

[[lean_lib]]
name = "RadialGreen"

[[lean_lib]]
name = "StaticVolume"

[[lean_lib]]
name = "LongitudinalProjection"

[[lean_lib]]
name = "ModalWronskian"
